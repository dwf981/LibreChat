---
# Added task to ensure that repo_dest exists before templating the .env file.
- name: Ensure repository directory exists
  file:
    path: "{{ repo_dest }}"
    state: directory

- name: Generate .env file from template
  template:
    src: ".env.j2"        # our Jinja2 template file (see below)
    dest: "{{ repo_dest }}/.env"  # places the generated .env into your repo directory
    mode: '0644'

- name: Generate librechat.yaml file from template
  template:
    src: "librechat.yaml.j2"    # new Jinja2 template file for librechat config
    dest: "{{ repo_dest }}/librechat.yaml"
    mode: '0644'
