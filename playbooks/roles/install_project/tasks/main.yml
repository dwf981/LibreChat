---
- name: Install dependencies, build Node project, and run index.js
  shell: |
    if [ ! -d "{{ repo_dest }}/node_modules" ]; then
      echo "Installing dependencies ..."
      cd "{{ repo_dest }}" || exit 1
      npm install || exit 1
      npm ci || exit 1
      npm run frontend || exit 1
      echo "Copying librechat.yaml file..."
      if [ ! -f librechat.yaml ]; then cp librechat.example.yaml librechat.yaml; fi
      echo ""
    fi
  args:
    executable: /bin/bash
  when: true
