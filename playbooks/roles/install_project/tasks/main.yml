---
- name: Install dependencies, build Node project, and run index.js
  shell: |
    if [ ! -d "{{ repo_dest }}/node_modules" ]; then
      echo "Installing dependencies ..."
      cd "{{ repo_dest }}" || exit 1
      npm install || exit 1
      npm ci || exit 1
      npm run frontend || exit 1
    fi
  args:
    executable: /bin/bash
  when: true
